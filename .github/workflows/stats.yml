name: Update profile stats

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        run: python3 .github/scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gh-stats.svg assets/gh-langs.svg
          git diff --cached --quiet || (git commit -m "chore: update profile stats" && git push)
